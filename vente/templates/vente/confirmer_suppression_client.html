{% extends 'vente/base.html' %}

{% block title %}
Supprimer un client
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body text-center">

            <h4 class="text-danger mb-3">
                Supprimer le client ?
            </h4>

            <p>
                Voulez-vous vraiment supprimer
                <strong>{{ client.nom }}</strong> ?
            </p>

            <p class="text-muted">
                Cette action supprimera également son compte utilisateur.
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Oui, supprimer
                </button>

                <a href="{% url 'vente:gestion_clients' %}"
                   class="btn btn-secondary">
                    Annuler
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
