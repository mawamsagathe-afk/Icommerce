{% extends 'vente/base.html' %}

{% block title %}Modifier une catégorie - Icommerce{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-header bg-warning">
                    <h4 class="mb-0">
                        Modifier la catégorie
                    </h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label for="nom" class="form-label">
                                Nom de la catégorie
                            </label>

                            <input
                                type="text"
                                name="nom"
                                id="nom"
                                class="form-control"
                                value="{{ categorie.nom }}"
                                required
                            >

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{% url 'vente:gestion_categories' %}"
                                class="btn btn-secondary"
                            >
                                Annuler
                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning"
                            >
                                Enregistrer
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
