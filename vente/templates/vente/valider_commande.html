{% extends 'vente/base.html' %}
{% load static %}

{% block title %}
Validation de la commande - Icommerce
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        <i class="fa-solid fa-truck me-2"></i>
                        Livraison
                    </h2>

                    <p class="text-muted">
                        Choisissez votre ville et votre quartier.
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <!-- VILLE -->
                        <div class="mb-4">

                            <label for="ville" class="form-label fw-bold">
                                Ville
                            </label>

                            <select
                                id="ville"
                                class="form-select form-select-lg"
                                required
                            >

                                <option value="">
                                    -- Choisir une ville --
                                </option>

                                {% for ville in villes %}

                                    <option value="{{ ville }}">
                                        {{ ville }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- QUARTIER -->
                        <div class="mb-4">

                            <label for="quartier" class="form-label fw-bold">
                                Quartier
                            </label>

                            <select
                                name="lieu_livraison"
                                id="quartier"
                                class="form-select form-select-lg"
                                required
                                disabled
                            >

                                <option value="">
                                    -- Choisir d'abord une ville --
                                </option>

                            </select>

                        </div>


                        <!-- FRAIS -->
                        <div
                            class="alert alert-warning d-flex justify-content-between align-items-center"
                        >

                            <span class="fw-bold">
                                <i class="fa-solid fa-truck me-2"></i>
                                Frais de livraison
                            </span>

                            <span
                                id="frais-livraison"
                                class="fw-bold"
                            >
                                0 FCFA
                            </span>

                        </div>


                        <!-- BOUTON -->
                        <div class="d-grid mt-4">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg fw-bold"
                                id="btn-confirmer"
                                disabled
                            >

                                <i class="fa-solid fa-check me-2"></i>

                                Confirmer la commande

                            </button>

                        </div>

                    </form>


                    <!-- RETOUR PANIER -->
                    <div class="mt-3 text-center">

                        <a
                            href="{% url 'vente:voir_panier' %}"
                            class="btn btn-outline-secondary"
                        >

                            <i class="fa-solid fa-arrow-left me-2"></i>

                            Retour au panier

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- DONNÉES DES LIEUX -->

<script>

const lieux = [
    {% for lieu in lieux %}
    {
        id: "{{ lieu.id }}",
        ville: "{{ lieu.ville|escapejs }}",
        quartier: "{{ lieu.quartier|escapejs }}",
        frais: "{{ lieu.frais }}"
    },
    {% endfor %}
];

</script>


<script src="{% static 'vente/js/livraison.js' %}"></script>

{% endblock %}
