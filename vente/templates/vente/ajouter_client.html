{% extends 'vente/base.html' %}

{% block title %}
Ajouter un client
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">
            <h4 class="mb-0">
                Ajouter un client
            </h4>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Nom
                    </label>

                    <input type="text"
                           name="nom"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Téléphone
                    </label>

                    <input type="text"
                           name="telephone"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Mot de passe
                    </label>

                    <input type="password"
                           name="mot_de_passe"
                           class="form-control"
                           required>
                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">
                        Ajouter le client
                    </button>

                    <a href="{% url 'vente:gestion_clients' %}"
                       class="btn btn-secondary">
                        Annuler
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
